aid: wellhub
name: Wellhub
description: >-
  Wellhub (formerly Gympass) is a corporate wellbeing platform that gives employees access
  to a network of fitness, mindfulness, therapy, nutrition, and sleep partners through their
  employer's benefits program. For system integrators it publishes a public Integrations API:
  an OAuth2 client-credentials REST API that lets a client's HR or payroll system sync employee
  eligibility to Wellhub in real time, so employees gain access on hire and lose it on
  termination. The API models eligibility as batch jobs (create a job, add up to 500 items,
  submit, then poll status and read per-record errors) and is documented on a Stoplight-powered
  developer hub with a downloadable OpenAPI 3.0 contract and a synthetic-data Sandbox. Wellhub
  is backed by Atomico, HV Capital, and SoftBank Vision Fund.
