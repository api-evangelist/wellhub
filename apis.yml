- aid: wellhub:wellhub-jobs-api
  name: Wellhub Jobs API
  description: >-
    Endpoints for managing eligibility batch jobs. A job follows a lifecycle: Create → Add Items → Submit
    → Monitor.


    After submission, the job transitions through the following statuses:

    - `PENDING` — job has been submitted and is queued.

    - `VALIDATING` — intermediate state while items are being validated.

    - `SUCCEEDED` — all items processed successfully (terminal).

    - `SUCCEEDED_WITH_ERRORS` — job has been partially processed, with error entries that must be fixed
    (terminal). → **Call `GET /errors` to review failures.**

    - `REJECTED` — job was rejected due to validation issues (terminal). → **Call `GET /errors` to review
    failures.**

    - `INTERNAL_SERVER_ERROR` — a server-side error occurred during processing; it is recommended to try
    again (terminal). → **Retry job submission.**
